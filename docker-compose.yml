version: "3.9"

services:
  backend:
    build:
      context: ./services/core
      dockerfile: ../../infra/docker/backend.Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-sumbandila}:${POSTGRES_PASSWORD:-sumbandila_dev}@db:5432/sumbandila_db
      - REDIS_URL=redis://redis:6379
      - ENV=development
    depends_on:
      - db
    volumes:
      - ./services/core:/app
    restart: unless-stopped

  frontend:
    build:
      context: ./apps/web
      dockerfile: ../../infra/docker/frontend.Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./apps/web:/app
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sumbandila}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sumbandila_dev}
      POSTGRES_DB: sumbandila_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./infra/docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data:
