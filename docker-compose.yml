version: '3.8'

services:
  web:
    build: 
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
    environment:
      - VITE_API_URL=http://localhost:8000

  auth-service:
    build:
      context: ./services/auth
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql://user:pass@db:5432/auth_db
      - PYTHONPATH=/app/packages # Critical for shared code access
    volumes:
      - .:/app

  core-service:
    build:
      context: ./services/core
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://user:pass@db:5432/core_db
      - PYTHONPATH=/app/packages
    volumes:
      - .:/app

  audit-service:
    build:
      context: ./services/audit
    ports:
      - "8002:8002"
    environment:
      - REDIS_URL=redis://redis:6379
      - PYTHONPATH=/app/packages
    volumes:
      - .:/app

  ai-service:
    build:
      context: ./services/ai
    ports:
      - "8003:8003"
    environment:
      - REDIS_URL=redis://redis:6379
      - PYTHONPATH=/app/packages
    volumes:
      - .:/app

  backup-service:
    build:
      context: ./services/backup
    environment:
      - S3_BUCKET=sumbandila-backups
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-mock}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-mock}
    volumes:
      - .:/app

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=pass
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # --- Observability Stack ---
  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686" # Web UI
      - "4317:4317" # OTLP gRPC

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    volumes:
      - ./infra/config/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    command: ["--config=/etc/otel-collector-config.yaml"]
    ports:
      - "8888:8888" # Metrics
      - "13133:13133" # Health check
    depends_on:
      - jaeger

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./infra/config/prometheus.yaml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    ports:
      - "3002:3000"
    depends_on:
      - prometheus
