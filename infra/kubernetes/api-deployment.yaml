apiVersion: apps/v1
kind: Deployment
metadata:
  name: sumbandila-api
  labels:
    app: sumbandila-api
    version: v4
spec:
  replicas: 3
  selector:
    matchLabels:
      app: sumbandila-api
  template:
    metadata:
      labels:
        app: sumbandila-api
    spec:
      containers:
        - name: api
          image: sumbandila/api:v4
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sumbandila-secrets
                  key: DATABASE_URL
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: sumbandila-secrets
                  key: SECRET_KEY
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: sumbandila-secrets
                  key: REDIS_URL
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: sumbandila-api-service
spec:
  type: LoadBalancer
  selector:
    app: sumbandila-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
