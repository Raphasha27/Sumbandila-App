global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'sumbandila-services'
    metrics_path: '/metrics'
    static_configs:
      - targets:
        - 'auth-service:8001'
        - 'core-service:8000'
        - 'audit-service:8002'
        - 'ai-service:8003'

  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8888']
