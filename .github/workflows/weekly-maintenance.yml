name: 🔧 Weekly Maintenance

on:
  schedule:
    # Run every Monday at 9:00 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  dependency-updates:
    name: 📦 Update Dependencies
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      
      - name: 📦 Update Node Dependencies
        run: |
          npm update --workspaces
          npm audit fix --audit-level=moderate
      
      - name: 🐍 Update Python Dependencies
        run: |
          pip install --upgrade pip
          pip install pip-audit
          pip-audit || true
      
      - name: 🔍 Check for Changes
        id: check_changes
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "changes=true" >> $GITHUB_OUTPUT
          else
            echo "changes=false" >> $GITHUB_OUTPUT
          fi
      
      - name: 📝 Create Pull Request
        if: steps.check_changes.outputs.changes == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: weekly dependency updates'
          title: '🔧 Weekly Dependency Updates'
          body: |
            ## 📦 Weekly Dependency Updates
            
            This PR contains automated dependency updates from the weekly maintenance workflow.
            
            ### Changes
            - Updated Node.js dependencies
            - Updated Python dependencies
            - Fixed security vulnerabilities
            
            ### Checklist
            - [ ] Review dependency changes
            - [ ] Verify builds pass
            - [ ] Check for breaking changes
            - [ ] Test critical functionality
            
            **Auto-generated by GitHub Actions**
          branch: chore/weekly-updates
          delete-branch: true
  
  readme-sync:
    name: 📝 Sync README Files
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      
      - name: 📝 Sync READMEs
        run: node scripts/sync-readme.js
      
      - name: 💾 Commit Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add apps/*/README.md services/*/README.md
          git diff --staged --quiet || git commit -m "docs: weekly README sync [skip ci]"
          git push
  
  health-check:
    name: 🏥 Health Check
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
      
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      
      - name: 🔍 Verify Production Deployment
        run: node scripts/verify-deployment.js production
        continue-on-error: true
      
      - name: 📊 Create Issue if Failed
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Production Health Check Failed',
              body: `## Production Health Check Failed
              
              The weekly health check detected issues with the production deployment.
              
              **Action Required:**
              - Check service logs
              - Verify all services are running
              - Check for recent deployments
              - Review error rates
              
              **Workflow Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['bug', 'production', 'urgent']
            })
  
  security-scan:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
      
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      
      - name: 🔒 Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      
      - name: 🔒 Run pip-audit
        run: |
          pip install pip-audit
          pip-audit || true
        continue-on-error: true
  
  cleanup:
    name: 🧹 Cleanup
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
      
      - name: 🧹 Close Stale Issues
        uses: actions/stale@v10
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          stale-issue-message: 'This issue has been automatically marked as stale because it has not had recent activity. It will be closed if no further activity occurs.'
          stale-pr-message: 'This PR has been automatically marked as stale because it has not had recent activity. It will be closed if no further activity occurs.'
          days-before-stale: 30
          days-before-close: 7
          stale-issue-label: 'stale'
          stale-pr-label: 'stale'
