name: ðŸ” Deployment Verification

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to verify'
        required: true
        type: choice
        options:
          - development
          - staging
          - production

permissions:
  contents: read
  deployments: read

jobs:
  verify-deployment:
    name: ðŸ” Verify ${{ github.event.inputs.environment || 'production' }} Deployment
    runs-on: ubuntu-latest
    
    steps:
      - name: ðŸ“¥ Checkout
        uses: actions/checkout@v4
      
      - name: ðŸŸ¢ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      
      - name: ðŸ” Run Verification
        run: node scripts/verify-deployment.js ${{ github.event.inputs.environment || 'production' }}
      
      - name: ðŸ“Š Upload Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-results
          path: verification-results.json
      
      - name: ðŸ’¬ Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: 'âœ… Deployment verification passed! All services are healthy.'
            })
