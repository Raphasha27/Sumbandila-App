name: 🛠️ Backend CI/CD (FastAPI)

on:
  push:
    branches: [ main ]
    paths:
      - 'services/**'
      - 'packages/**'
      - 'docker-compose.yml'
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          # Install shared package dependencies
          if [ -f services/requirements.txt ]; then pip install -r services/requirements.txt; fi

      - name: Lint with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Build Docker Images (Identity, Core, Audit, AI)
        run: |
          docker-compose build auth-service core-service audit-service ai-service
