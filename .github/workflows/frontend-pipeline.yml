name: 🌐 Frontend CI/CD (Web & Mobile)

on:
  push:
    branches:
      - '**'
    paths:
      - 'apps/**'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    branches:
      - '**'

jobs:
  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build --workspace=@sumbandila/web

  mobile-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install Mobile Dependencies
        run: |
          cd apps/mobile
          npm install

      - name: Validate Mobile App Config
        run: |
          cd apps/mobile
          node -e "require('./app.json'); console.log('app.json is valid');"
