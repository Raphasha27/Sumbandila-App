name: 🌐 Frontend CI/CD (Web & Mobile)

on:
  push:
    branches: [ main ]
    paths:
      - 'apps/**'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    branches: [ main ]

jobs:
  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build --workspace=@sumbandila/web

  mobile-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }} # Optional for local-only builds

      - name: Build Mobile (Android Mock)
        run: |
          cd apps/mobile
          npm install
          # expo build:android --dry-run
