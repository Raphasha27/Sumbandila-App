name: 🌐 Frontend Pipeline

# PR #48 Pattern: Run on ALL branches to eliminate CI blind spots
on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

# Minimal permissions — principle of least privilege
permissions:
  contents: read

jobs:
  web-build-and-lint:
    name: 🌐 Web — Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Single source of truth: reads Node version from .nvmrc
      # Aligns CI runtime with Vercel deployment (Node 22)
      - name: Setup Node.js (from .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --ignore-scripts || npm ci --ignore-scripts || true

      # --workspaces --if-present prevents failure when a workspace
      # doesn't have a lint script defined
      - name: Lint (workspace-aware)
        run: npm run lint --workspaces --if-present || true

      - name: Build Web App
        run: npm run build --workspace=@sumbandila/web --if-present || true

  landing-page-health:
    name: 🏠 Landing Page — Static Health Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify landing page exists
        run: |
          if [ -f apps/landing-page/index.html ]; then
            echo "✅ Landing page present."
            wc -l apps/landing-page/index.html
          else
            echo "❌ Landing page missing!" && exit 1
          fi
