name: Daily Contribution Keeper

on:
  schedule:
    # Run every day at 9 AM UTC (adjust to your timezone)
    - cron: '0 9 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  daily-update:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
      
      - name: Check for today's commits
        id: check_commits
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          COMMITS=$(git log --since="$TODAY 00:00" --oneline | wc -l)
          echo "commits=$COMMITS" >> $GITHUB_OUTPUT
          echo "Today's commits: $COMMITS"
      
      - name: Update timestamp
        if: steps.check_commits.outputs.commits == '0'
        run: |
          DATE=$(date -u +"%A, %B %d, %Y at %H:%M:%S UTC")
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "Last Updated: $DATE" > LAST_UPDATED.txt
          echo "Timestamp: $TIMESTAMP" >> LAST_UPDATED.txt
          echo "Automated by: GitHub Actions" >> LAST_UPDATED.txt
          echo "Repository: Sumbandila-App" >> LAST_UPDATED.txt
      
      - name: Commit and push changes
        if: steps.check_commits.outputs.commits == '0'
        run: |
          git add LAST_UPDATED.txt
          DATE=$(date -u +"%A, %B %d, %Y")
          git commit -m "chore: daily update - $DATE

          - Update project timestamp
          - Maintain contribution streak
          - Automated by GitHub Actions" || exit 0
          git push
      
      - name: Report status
        run: |
          if [ "${{ steps.check_commits.outputs.commits }}" -eq "0" ]; then
            echo "✅ Daily commit created successfully!"
          else
            echo "ℹ️ Already have commits today. No action needed."
          fi
