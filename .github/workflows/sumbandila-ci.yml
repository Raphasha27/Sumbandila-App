name: 🛡️ Sumbandila CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ── Web (Vite / React) ───────────────────────────────────────────────────────
  web:
    name: 🌐 Web (Lint & Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install root dependencies
        run: npm install

      - name: Lint
        run: npm run lint --workspace=@sumbandila/web --if-present

      - name: Build
        run: npm run build --workspace=@sumbandila/web

  # ── Backend Python services ──────────────────────────────────────────────────
  backend:
    name: 🐍 Backend (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth, core, ai]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: services/${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install flake8

      - name: Lint
        working-directory: services/${{ matrix.service }}
        run: |
          python -m flake8 . \
            --max-line-length=120 \
            --exclude=__pycache__,.git,venv \
            --ignore=E501,W503 \
            --count --statistics

      - name: Test
        working-directory: services/${{ matrix.service }}
        run: |
          if [ -d "tests" ]; then
            python -m pytest tests/ -v
          else
            echo "No tests directory found for ${{ matrix.service }} — skipping."
          fi

  # ── Mobile (Expo / React Native) ─────────────────────────────────────────────
  mobile:
    name: 📱 Mobile (Install Check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: npm install --legacy-peer-deps

      - name: Validate app.json
        working-directory: apps/mobile
        run: |
          if [ -f app.json ]; then
            node -e "require('./app.json'); console.log('✅ app.json is valid');"
          else
            echo "No app.json found — skipping."
          fi
