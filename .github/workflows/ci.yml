name: Sumbandila CI — Quality & Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── 1. BUILD CHECK ──────────────────────────────────────────────
  build:
    name: Build Landing App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/landing/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: apps/landing

      - name: Next.js build
        run: npm run build
        working-directory: apps/landing
        env:
          NEXT_TELEMETRY_DISABLED: 1

  # ── 2. DEPENDENCY SECURITY AUDIT ────────────────────────────────
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: npm audit (landing)
        run: npm audit --audit-level=high --omit=dev
        working-directory: apps/landing
        continue-on-error: true   # warn only — never block on zero-cost plan

  # ── 3. SECRET LEAK SCAN ─────────────────────────────────────────
  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks — detect secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 4. VULNERABILITY SCAN ───────────────────────────────────────
  trivy:
    name: Trivy Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'          # report only — Hobby plan safe
          ignore-unfixed: true
          vuln-type: 'library'
          severity: 'CRITICAL,HIGH'
