name: Sumbandila Enterprise CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  integrity:
    name: System Integrity Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Check Environment
        run: npm run check-env

  build-and-lint:
    name: Build & Lint Monorepo
    needs: integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Verify Workspaces
        run: npm run verify

  python-services:
    name: Python Services Health
    needs: integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest pydantic
          if [ -f services/requirements.txt ]; then pip install -r services/requirements.txt; fi

      - name: Lint Python
        run: make lint
        continue-on-error: true

      - name: Test Python
        run: make test
        continue-on-error: true
