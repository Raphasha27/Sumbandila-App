name: Kirov CI Pipeline

on:
  push:
      branches: [main, dev]
        pull_request:
            branches: [main, dev]

            jobs:
              backend:
                  name: Backend - ${{ matrix.service }}
                      runs-on: ubuntu-latest
                          strategy:
                                fail-fast: false
                                      matrix:
                                              service: [auth, core]
                                                  defaults:
                                                        run:
                                                                working-directory: services/${{ matrix.service }}
                                                                    steps:
                                                                          - uses: actions/checkout@v4
                                                                                - name: Set up Python
                                                                                        uses: actions/setup-python@v5
                                                                                                with:
                                                                                                          python-version: "3.11"
                                                                                                                    cache: "pip"
                                                                                                                              cache-dependency-path: services/${{ matrix.service }}/requirements.txt
                                                                                                                                    - name: Install dependencies
                                                                                                                                            run: |
                                                                                                                                                      pip install --upgrade pip
                                                                                                                                                                pip install -r requirements.txt
                                                                                                                                                                          pip install pytest pytest-asyncio flake8 httpx
                                                                                                                                                                                - name: Lint (flake8)
                                                                                                                                                                                        run: |
                                                                                                                                                                                                  flake8 . --max-line-length=120 --exclude=__pycache__,.git,venv --ignore=E501,W503
                                                                                                                                                                                                        - name: Run unit tests (pytest)
                                                                                                                                                                                                                env:
                                                                                                                                                                                                                          DATABASE_URL: "sqlite:///./test.db"
                                                                                                                                                                                                                                    SECRET_KEY: "test-secret-key-for-ci"
                                                                                                                                                                                                                                              ENVIRONMENT: "test"
                                                                                                                                                                                                                                                        DEBUG: "true"
                                                                                                                                                                                                                                                                run: pytest tests/ -v --tb=short --ignore=tests/__pycache__
                                                                                                                                                                                                                                                                
                                                                                                                                                                                                                                                                  frontend:
                                                                                                                                                                                                                                                                      name: Frontend - Lint, Test, Build
                                                                                                                                                                                                                                                                          runs-on: ubuntu-latest
                                                                                                                                                                                                                                                                              defaults:
                                                                                                                                                                                                                                                                                    run:
                                                                                                                                                                                                                                                                                            working-directory: apps/web
                                                                                                                                                                                                                                                                                                steps:
                                                                                                                                                                                                                                                                                                      - uses: actions/checkout@v4
                                                                                                                                                                                                                                                                                                            - name: Set up Node.js
                                                                                                                                                                                                                                                                                                                    uses: actions/setup-node@v4
                                                                                                                                                                                                                                                                                                                            with:
                                                                                                                                                                                                                                                                                                                                      node-version: "20"
                                                                                                                                                                                                                                                                                                                                            - name: Install dependencies
                                                                                                                                                                                                                                                                                                                                                    run: npm install
                                                                                                                                                                                                                                                                                                                                                          - name: Lint (ESLint)
                                                                                                                                                                                                                                                                                                                                                                  run: npm run lint
                                                                                                                                                                                                                                                                                                                                                                        - name: Run tests
                                                                                                                                                                                                                                                                                                                                                                                run: npm test
                                                                                                                                                                                                                                                                                                                                                                                      - name: Build
                                                                                                                                                                                                                                                                                                                                                                                              run: npm run build
                                                                                                                                                                                                                                                                                                                                                                                              
                                                                                                                                                                                                                                                                                                                                                                                                security:
                                                                                                                                                                                                                                                                                                                                                                                                    name: Security - CodeQL Analysis
                                                                                                                                                                                                                                                                                                                                                                                                        runs-on: ubuntu-latest
                                                                                                                                                                                                                                                                                                                                                                                                            permissions:
                                                                                                                                                                                                                                                                                                                                                                                                                  actions: read
                                                                                                                                                                                                                                                                                                                                                                                                                        contents: read
                                                                                                                                                                                                                                                                                                                                                                                                                              security-events: write
                                                                                                                                                                                                                                                                                                                                                                                                                                  steps:
                                                                                                                                                                                                                                                                                                                                                                                                                                        - uses: actions/checkout@v4
                                                                                                                                                                                                                                                                                                                                                                                                                                              - name: Initialize CodeQL
                                                                                                                                                                                                                                                                                                                                                                                                                                                      uses: github/codeql-action/init@v3
                                                                                                                                                                                                                                                                                                                                                                                                                                                              with:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        languages: python, javascript
                                                                                                                                                                                                                                                                                                                                                                                                                                                                              - name: Perform CodeQL Analysis
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      uses: github/codeql-action/analyze@v3
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      
