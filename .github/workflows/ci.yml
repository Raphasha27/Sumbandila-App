name: Sumbandila CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  web:
    name: "Web (Lint & Build)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm install
      - name: Lint Web
        run: npm run lint --workspace=@sumbandila/web
      - name: Build Web
        run: npm run build --workspace=@sumbandila/web

  backend:
    name: "Backend (Lint & Health Check)"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth, core]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: services/${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest flake8 httpx
      - name: Lint
        working-directory: services/${{ matrix.service }}
        run: python -m flake8 . --max-line-length=120 --exclude=__pycache__,.git,venv --ignore=E501,W503
      - name: Test
        working-directory: services/${{ matrix.service }}
        run: |
          if [ -d "tests" ]; then
            python -m pytest tests/ -v
          else
            echo "No tests found for ${{ matrix.service }}"
          fi

  mobile:
    name: "Mobile (Install Check)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        working-directory: apps/mobile
        run: npm install --legacy-peer-deps
