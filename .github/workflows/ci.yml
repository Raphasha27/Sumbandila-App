name: Sumbandila Demo CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  demo-validation:
    name: "🚀 Demo Prototype Validation"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prototype Integrity Check
        run: |
          echo "Starting demo prototype validation..."
          echo "Verifying project structure..."
          [ -d "apps/web" ] && echo "✅ Web app directory found"
          [ -d "apps/mobile" ] && echo "✅ Mobile app directory found"
          [ -d "services" ] && echo "✅ Backend services directory found"
          echo "Demo validation complete. Billing is currently disabled for heavy CI jobs."
          echo "This repository is in 'Demo Prototype' mode."
