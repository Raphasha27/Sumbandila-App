name: Sumbandila CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  web:
    name: Web CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        working-directory: apps/web
        run: npm ci || npm install
      - name: Lint
        working-directory: apps/web
        run: npm run lint --if-present
      - name: Build
        working-directory: apps/web
        run: npm run build --if-present

  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth, core]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: services/${{ matrix.service }}/requirements.txt
      - name: Install
        working-directory: services/${{ matrix.service }}
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest flake8 httpx
      - name: Lint
        working-directory: services/${{ matrix.service }}
        run: flake8 . --max-line-length=120 --exclude=__pycache__,.git,venv
      - name: Test
        working-directory: services/${{ matrix.service }}
        run: pytest tests/ -v || echo "No tests yet"

  mobile:
    name: Mobile CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        working-directory: apps/mobile
        run: npm install
