          cache: 'pip'

      - name: Install shared dependencies
        run: |
          pip install --upgrade pip
          if [ -f services/requirements.txt ]; then pip install -r services/requirements.txt; fi

      - name: Install Core Service dependencies
        run: |
          if [ -f services/core/requirements.txt ]; then pip install -r services/core/requirements.txt; fi

      - name: Install Auth Service dependencies
        run: |
          if [ -f services/auth/requirements.txt ]; then pip install -r services/auth/requirements.txt; fi

      - name: Run Backend Tests
        run: |
          cd services
          # Add current directory and packages to PYTHONPATH
