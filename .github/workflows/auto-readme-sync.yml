name: 📝 Auto README Sync

on:
  push:
    branches: [ main ]
    paths:
      - 'package.json'
      - 'apps/*/package.json'
      - 'services/*/requirements.txt'
      - 'scripts/sync-readme.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-readme:
    name: 📝 Synchronize README Files
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      
      - name: 📦 Install Dependencies
        run: npm install
      
      - name: 📝 Run README Sync
        run: node scripts/sync-readme.js
      
      - name: 🔍 Check for Changes
        id: check_changes
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "changes=true" >> $GITHUB_OUTPUT
          else
            echo "changes=false" >> $GITHUB_OUTPUT
          fi
      
      - name: 💾 Commit Changes
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add apps/*/README.md services/*/README.md
          git commit -m "docs: auto-sync README files [skip ci]"
          git push
