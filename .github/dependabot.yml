version: 2
updates:
  # ── Python services ──────────────────────────────────────────────────────────
  - package-ecosystem: "pip"
    directory: "/services/auth"
    schedule:
      interval: "monthly"
    labels: ["chore", "dependencies"]
    groups:
      python-auth:
        patterns: ["*"]

  - package-ecosystem: "pip"
    directory: "/services/core"
    schedule:
      interval: "monthly"
    labels: ["chore", "dependencies"]
    groups:
      python-core:
        patterns: ["*"]

  - package-ecosystem: "pip"
    directory: "/services/ai"
    schedule:
      interval: "monthly"
    labels: ["chore", "dependencies"]
    groups:
      python-ai:
        patterns: ["*"]

  # ── Web app (Vite / React) ────────────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: "monthly"
    labels: ["chore", "dependencies"]
    groups:
      npm-web-all:
        patterns: ["*"]
    ignore:
      # Expo SDK major bumps require manual testing
      - dependency-name: "expo*"
        update-types: ["version-update:semver-major"]

  # ── Mobile app (Expo / React Native) ─────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/apps/mobile"
    schedule:
      interval: "monthly"
    labels: ["chore", "dependencies"]
    groups:
      npm-mobile-all:
        patterns: ["*"]
    ignore:
      - dependency-name: "expo*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-native"
        update-types: ["version-update:semver-major"]

  # ── Root workspace ────────────────────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    labels: ["chore", "dependencies"]
    groups:
      npm-root-all:
        patterns: ["*"]

  # ── GitHub Actions ────────────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels: ["chore", "ci"]
    groups:
      actions-all:
        patterns: ["*"]
