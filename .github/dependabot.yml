version: 2
updates:
  # Python / FastAPI backend
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    labels:
      - "chore"
      - "dependencies"
    groups:
      python-all:
        patterns:
          - "*"

  # Node.js / React / Next.js frontend
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    labels:
      - "chore"
      - "dependencies"
    groups:
      npm-all:
        patterns:
          - "*"

  # GitHub Actions themselves
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "chore"
      - "ci"
    groups:
      actions-all:
        patterns:
          - "*"
