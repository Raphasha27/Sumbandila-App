[tool.pyright]
include = ["services/core", "scripts", "ai"]
exclude = ["**/node_modules", "**/__pycache__", "services/core/.venv"]
venvPath = "services/core"
venv = ".venv"
pythonVersion = "3.11"
typeCheckingMode = "off"

[tool.pyre]
source_directories = ["services/core"]
search_path = ["services/core"]
python_version = "3.11"
